<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Nana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        canvas {
            display: block;
        }
        
        .loading {
            position: absolute;
            color: #ff3366;
            font-size: 48px;
            opacity: 1;
            transition: opacity 1s ease;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.7);
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            .loading {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="loading">❤️</div>
    <canvas id="canvas"></canvas>

    <script>
        // Configuration
        const opts = {
            charSize: 30,
            fireworkSpawnTime: 40, // Reduced for faster animation
            fireworkSpeed: 0.08,   // Increased for faster animation
            letterSpacing: 35,
            fireworkHeight: 100,
            gravity: 0.25,         // Increased for faster animation
            bounce: 0.7
        };

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h, hh, hw;
        
        // Letters array
        let letters = [];
        
        // Text to display
        const text = "I LOVE YOU NANA";
        
        // Initialize
        function init() {
            resizeCanvas();
            createLetters();
            animate();
            
            // Hide loading text after 1.5 seconds
            setTimeout(() => {
                document.querySelector('.loading').classList.add('hidden');
            }, 1500);
        }
        
        // Resize canvas to fit window
        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            hh = h / 2;
            hw = w / 2;
        }
        
        // Letter constructor
        function Letter(char, x, y) {
            this.char = char;
            this.x = x;
            this.y = y;
            this.dx = -ctx.measureText(char).width / 2;
            this.dy = opts.charSize / 2;
            this.fireworkDy = this.y - opts.fireworkHeight;
            this.targetY = y;
            
            // Color based on position
            const hue = (x / w) * 360;
            this.color = `hsl(${hue}, 80%, 50%)`;
            this.lightColor = `hsl(${hue}, 80%, 70%)`;
            this.alphaColor = `hsla(${hue}, 80%, 50%, 0.7)`;
            
            this.reset();
        }
        
        // Reset letter for animation
        Letter.prototype.reset = function() {
            this.phase = "firework";
            this.tick = 0;
            this.spawned = false;
            this.spawningTime = (opts.fireworkSpawnTime * Math.random()) | 0;
            this.y = h + 50; // Start below the screen
            this.velocityY = -15 - Math.random() * 10;
        };
        
        // Update letter position
        Letter.prototype.update = function() {
            if (this.phase === "firework") {
                if (!this.spawned) {
                    this.tick++;
                    if (this.tick >= this.spawningTime) {
                        this.spawned = true;
                    }
                    return;
                }
                
                // Move up for firework effect
                this.y += this.velocityY;
                this.velocityY += opts.gravity;
                
                // When reaching target height, switch to falling
                if (this.velocityY >= 0 && this.y <= this.targetY) {
                    this.phase = "falling";
                    this.velocityY = 0;
                }
            } else if (this.phase === "falling") {
                // Apply gravity
                this.velocityY += opts.gravity;
                this.y += this.velocityY;
                
                // Bounce when hitting the target position
                if (this.y >= this.targetY) {
                    this.y = this.targetY;
                    this.velocityY = -this.velocityY * opts.bounce;
                    
                    // Stop bouncing when velocity is small
                    if (Math.abs(this.velocityY) < 0.5) {
                        this.velocityY = 0;
                        this.phase = "rest";
                    }
                }
            }
        };
        
        // Draw letter
        Letter.prototype.draw = function() {
            ctx.save();
            
            if (this.phase === "firework" && this.spawned) {
                // Firework trail
                ctx.fillStyle = this.alphaColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y + 10, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Glow effect
                ctx.shadowColor = this.lightColor;
                ctx.shadowBlur = 15;
            }
            
            // Draw the letter
            ctx.fillStyle = this.color;
            ctx.font = `bold ${opts.charSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.char, this.x, this.y);
            
            ctx.restore();
        };
        
        // Create letters from text
        function createLetters() {
            letters = [];
            
            // Calculate the total width needed for the text
            ctx.font = `bold ${opts.charSize}px Arial`;
            const totalWidth = ctx.measureText(text).width + (text.length - 1) * opts.letterSpacing;
            
            // Ensure the text fits within the screen
            if (totalWidth > w * 0.9) {
                opts.letterSpacing = (w * 0.9 - ctx.measureText(text).width) / (text.length - 1);
            }
            
            const startX = (w - totalWidth) / 2;
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                
                // Calculate x position for each character
                let charWidth = ctx.measureText(char).width;
                const x = startX + charWidth/2;
                
                // Update startX for next character
                startX += charWidth + opts.letterSpacing;
                
                const y = hh;
                
                letters.push(new Letter(char, x, y));
            }
        }
        
        // Animation loop
        function animate() {
            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, w, h);
            
            // Update and draw letters
            letters.forEach(letter => {
                letter.update();
                letter.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            createLetters();
        });
        
        // Start animation after 1.8 seconds (within 2 seconds as requested)
        setTimeout(init, 1800);
    </script>
</body>
</html>
