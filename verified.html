<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile Verified</title>
  <meta http-equiv="refresh" content="7;url=https://anilist.co/user/ahsanhabibmuaz" />
  <style>
    :root {
      --bg: #f9f9f9;
      --accent: #3FA9F5; /* Verified GIF exact blue color */
      --text: #111;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* Prevent scrolling */
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      transform: translateY(-8%);
    }

    /* Glow effect matching GIF color */
    .verified {
      width: clamp(120px, 22vmin, 260px);
      height: auto;
      margin-bottom: 1rem;
      animation: glow 2.5s infinite ease-in-out;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 12px var(--accent)); }
      50% { filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 20px var(--accent)); }
    }

    h1 {
      margin: 0;
      font-weight: 800;
      font-size: clamp(36px, 6.6vw, 84px);
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    p {
      margin: 0.5rem 0 0;
      font-size: clamp(16px, 2.4vw, 24px);
      opacity: 0.9;
    }

    .countdown {
      margin-top: 0.25rem;
      font-weight: 600;
      font-size: clamp(14px, 1.8vw, 18px);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="verified" src="https://i.postimg.cc/Xv1Gg2Lr/verified.gif" alt="Verified symbol">
    <h1>This profile is verified</h1>
    <p>Redirecting to the original AniList profile...</p>
    <div class="countdown">Redirecting in <span id="t">7</span>s</div>
  </div>

  <script>
    let t = 7;
    const tEl = document.getElementById('t');
    setInterval(() => {
      t--;
      if (t >= 0) tEl.textContent = t;
    }, 1000);
  </script>
</body>
</html>
